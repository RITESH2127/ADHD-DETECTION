<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc">
<title id="title">Complete animated architecture of the EEG hybrid CNN–Vision Transformer and functional-connectivity model</title>
<desc id="desc">A detailed animated technical diagram. A cleaned two-second EEG window with 19 channels at 128 hertz creates a spectral input and a Pearson connectivity input. The spectral path uses an on-model STFT, three CNN stages, forty tokens, three Transformer blocks, and global average pooling to produce 64 features. The connectivity path extracts 171 unique correlations and encodes them into 32 features. The vectors concatenate to 96 features and pass through a dense classifier to produce Control and ADHD probabilities. Supporting notes describe training and participant-grouped evaluation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset=".55" stop-color="#14243a"/><stop offset="1" stop-color="#101b30"/></linearGradient>
  <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123c55"/><stop offset="1" stop-color="#075985"/></linearGradient>
  <linearGradient id="connect" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#503112"/><stop offset="1" stop-color="#854d0e"/></linearGradient>
  <linearGradient id="fusion" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#382064"/><stop offset="1" stop-color="#542c91"/></linearGradient>
  <linearGradient id="out" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14532d"/><stop offset="1" stop-color="#166534"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#9bb3ce"/></marker>
  <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#67e8f9"/></marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#fbbf24"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .h1{font-size:31px;font-weight:700;fill:#f8fafc}.subtitle{font-size:15px;fill:#a9bdd3}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px}
    .head{font-size:16px;font-weight:700;fill:#f8fafc}.body{font-size:13px;fill:#d9e5f2}.muted{font-size:12px;fill:#a8bbd0}
    .tiny{font-size:11px;fill:#a8bbd0}.metric{font-size:20px;font-weight:700;fill:#fff}.num{font-size:12px;font-weight:700;fill:#071525}
    .panel{fill:#0d1b2d;stroke:#2c4059;stroke-width:1.3}
    .card{fill:#172a40;stroke:#4b617b;stroke-width:1.25}
    .specCard{fill:#10364a;stroke:#38bdf8;stroke-width:1.45}
    .connCard{fill:#3c2b17;stroke:#f59e0b;stroke-width:1.45}
    .fuseCard{fill:#352052;stroke:#c4b5fd;stroke-width:1.5}
    .wire{fill:none;stroke:#91a9c4;stroke-width:2.6;marker-end:url(#arrow)}
    .wireS{fill:none;stroke:#38bdf8;stroke-width:2.8;marker-end:url(#arrowCyan)}
    .wireC{fill:none;stroke:#f59e0b;stroke-width:2.8;marker-end:url(#arrowAmber)}
    .flow{fill:none;stroke:#e0f7ff;stroke-width:3.3;stroke-linecap:round;stroke-dasharray:5 15;animation:travel 1.7s linear infinite}
    .flowAmber{fill:none;stroke:#fff0c2;stroke-width:3.3;stroke-linecap:round;stroke-dasharray:5 15;animation:travel 1.9s linear infinite}
    .flowPurple{fill:none;stroke:#e9ddff;stroke-width:3.3;stroke-linecap:round;stroke-dasharray:5 15;animation:travel 1.7s linear infinite}
    .tag{font-size:11px;font-weight:700;letter-spacing:.7px}
    .chip{fill:#21364e;stroke:#4b617b;stroke-width:1}
    .divider{stroke:#31465e;stroke-width:1}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes travel{to{stroke-dashoffset:-40}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.flowAmber,.flowPurple,.pulse{animation:none}.flow,.flowAmber,.flowPurple{stroke-dasharray:4 10}}
  </style>
</defs>

<rect width="1600" height="1190" rx="24" fill="url(#bg)"/>
<text x="54" y="55" class="h1">Inside the hybrid EEG model</text>
<text x="56" y="83" class="subtitle">A complete forward-pass map · spectral-temporal learning + functional connectivity · late feature fusion</text>
<rect x="1320" y="38" width="224" height="34" rx="17" fill="#173b36" stroke="#34d399"/>
<circle cx="1341" cy="55" r="5" fill="#34d399" class="pulse"/>
<text x="1355" y="59" class="tag" fill="#a7f3d0">IMPLEMENTED EEG MODEL</text>

<!-- shared preparation -->
<rect x="48" y="112" width="1504" height="142" rx="17" class="panel"/>
<text x="72" y="140" class="eyebrow" fill="#cbd5e1">STAGE 0 · SHARED EEG PREPARATION</text>
<g transform="translate(78 158)">
  <rect width="220" height="72" rx="10" class="card"/>
  <text x="16" y="25" class="tag" fill="#93c5fd">RAW RECORDING</text>
  <path d="M16 48 C25 29 34 67 43 46 S61 27 70 49 S88 68 97 44 S115 29 124 49 S142 62 151 43 S169 29 178 47 S196 61 205 43" fill="none" stroke="#7dd3fc" stroke-width="2"/>
</g>
<path d="M298 194 H332" class="wire"/>
<rect x="338" y="158" width="310" height="72" rx="10" class="card"/>
<text x="493" y="184" class="head" text-anchor="middle">Clean + standardize</text>
<text x="493" y="207" class="muted" text-anchor="middle">1–40 Hz FIR · CAR · ICA/ICLabel · z-score</text>
<path d="M648 194 H682" class="wire"/>
<rect x="688" y="158" width="300" height="72" rx="10" class="card"/>
<text x="838" y="184" class="head" text-anchor="middle">Segment the EEG</text>
<text x="838" y="207" class="muted" text-anchor="middle">256 samples · 2 seconds · 19 channels</text>
<path d="M988 194 H1022" class="wire"/>
<rect x="1028" y="150" width="492" height="88" rx="12" fill="#1b3048" stroke="#7892ad" stroke-width="1.4"/>
<text x="1052" y="178" class="tag" fill="#bfdbfe">SHARED WINDOW TENSOR</text>
<text x="1052" y="210" class="metric">[B, 256, 19]</text>
<text x="1280" y="207" class="muted">B = batch size · 128 Hz</text>

<!-- branch labels and split -->
<path d="M1274 238 V277 H535 V305" class="wireS"/>
<path d="M1274 238 V277 H1290 V305" class="wireC"/>
<path d="M1274 238 V277 H535 V305" class="flow"/>
<path d="M1274 238 V277 H1290 V305" class="flowAmber"/>

<!-- spectral branch -->
<rect x="48" y="294" width="970" height="438" rx="18" fill="#0b2638" stroke="#155e75" stroke-width="1.5"/>
<rect x="70" y="313" width="36" height="25" rx="7" fill="#0e7490"/><text x="88" y="330" class="num" text-anchor="middle">01</text>
<text x="119" y="331" class="eyebrow" fill="#67e8f9">SPECTRAL CNN + VISION TRANSFORMER</text>
<text x="75" y="360" class="muted">STFT → local CNN features → 40 learned tokens → Transformer context.</text>

<!-- spectral stage 1 -->
<path d="M535 305 V375 H158 V390" class="wireS"/><path d="M535 305 V375 H158 V390" class="flow"/>
<rect x="74" y="390" width="168" height="264" rx="12" class="specCard"/>
<text x="92" y="418" class="tag" fill="#7dd3fc">1 · TRANSFORM</text>
<text x="158" y="450" class="head" text-anchor="middle">STFT layer</text>
<text x="158" y="473" class="muted" text-anchor="middle">inside TensorFlow</text>
<g transform="translate(105 493)">
  <rect width="106" height="74" rx="5" fill="#0b2032" stroke="#38bdf8"/>
  <g opacity=".9">
    <path d="M10 63V12M10 63H96" stroke="#66849d" stroke-width="1"/>
    <path d="M15 57L25 45L35 50L45 22L55 36L65 15L75 31L85 20L95 10" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <path d="M15 61L25 57L35 52L45 49L55 47L65 43L75 40L85 38L95 34" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
  </g>
</g>
<text x="158" y="594" class="body" text-anchor="middle">Frame 128 · step 8</text>
<text x="158" y="615" class="body" text-anchor="middle">FFT 128</text>
<text x="158" y="640" class="tag" fill="#bae6fd" text-anchor="middle">[B, 41, 17, 19]</text>

<path d="M242 522 H260" class="wireS"/><path d="M242 522 H260" class="flow"/>

<!-- CNN -->
<rect x="264" y="390" width="264" height="264" rx="12" class="specCard"/>
<text x="282" y="418" class="tag" fill="#7dd3fc">2 · LOCAL FEATURE LEARNING</text>
<text x="396" y="449" class="head" text-anchor="middle">CNN feature extractor</text>
<g transform="translate(285 466)">
  <rect width="222" height="42" rx="7" fill="#164e63" stroke="#67e8f9"/>
  <text x="12" y="18" class="tag" fill="#cffafe">STAGE 1</text><text x="210" y="27" class="body" text-anchor="end">16 filters</text>
  <text x="111" y="35" class="tiny" text-anchor="middle">[B, 20, 8, 16]</text>
  <rect y="51" width="222" height="42" rx="7" fill="#155e75" stroke="#67e8f9"/>
  <text x="12" y="69" class="tag" fill="#cffafe">STAGE 2</text><text x="210" y="78" class="body" text-anchor="end">32 filters</text>
  <text x="111" y="86" class="tiny" text-anchor="middle">[B, 10, 8, 32]</text>
  <rect y="102" width="222" height="42" rx="7" fill="#0e7490" stroke="#67e8f9"/>
  <text x="12" y="120" class="tag" fill="#cffafe">STAGE 3</text><text x="210" y="129" class="body" text-anchor="end">64 filters</text>
  <text x="111" y="137" class="tiny" text-anchor="middle">[B, 5, 8, 64]</text>
</g>
<text x="396" y="632" class="tiny" text-anchor="middle">Factorized temporal/frequency convs, then 3×3 convs</text>

<path d="M528 522 H546" class="wireS"/><path d="M528 522 H546" class="flow"/>

<!-- tokens -->
<rect x="550" y="390" width="180" height="264" rx="12" class="specCard"/>
<text x="568" y="418" class="tag" fill="#7dd3fc">3 · TOKENIZE</text>
<text x="640" y="449" class="head" text-anchor="middle">Feature grid</text>
<g transform="translate(584 470)">
  <g fill="#155e75" stroke="#7dd3fc" stroke-width="1">
    <rect x="0" y="0" width="22" height="22" rx="3"/><rect x="27" y="0" width="22" height="22" rx="3"/><rect x="54" y="0" width="22" height="22" rx="3"/><rect x="81" y="0" width="22" height="22" rx="3"/>
    <rect x="0" y="27" width="22" height="22" rx="3"/><rect x="27" y="27" width="22" height="22" rx="3"/><rect x="54" y="27" width="22" height="22" rx="3"/><rect x="81" y="27" width="22" height="22" rx="3"/>
    <rect x="0" y="54" width="22" height="22" rx="3"/><rect x="27" y="54" width="22" height="22" rx="3"/><rect x="54" y="54" width="22" height="22" rx="3"/><rect x="81" y="54" width="22" height="22" rx="3"/>
    <rect x="0" y="81" width="22" height="22" rx="3"/><rect x="27" y="81" width="22" height="22" rx="3"/><rect x="54" y="81" width="22" height="22" rx="3"/><rect x="81" y="81" width="22" height="22" rx="3"/>
  </g>
  <text x="51" y="122" class="tiny" text-anchor="middle">5 × 8 = 40 patches</text>
</g>
<text x="640" y="615" class="body" text-anchor="middle">Flatten grid to sequence</text>
<text x="640" y="640" class="tag" fill="#bae6fd" text-anchor="middle">[B, 40, 64]</text>

<path d="M730 522 H748" class="wireS"/><path d="M730 522 H748" class="flow"/>

<!-- transformer -->
<rect x="752" y="390" width="242" height="264" rx="12" class="specCard"/>
<text x="770" y="418" class="tag" fill="#7dd3fc">4 · GLOBAL TOKEN MIXING</text>
<text x="873" y="449" class="head" text-anchor="middle">Vision Transformer</text>
<rect x="775" y="465" width="196" height="33" rx="6" fill="#164e63" stroke="#67e8f9"/>
<text x="873" y="486" class="body" text-anchor="middle">Learned position embeddings</text>
<g transform="translate(775 509)">
  <rect width="196" height="74" rx="8" fill="#0c2e43" stroke="#38bdf8"/>
  <text x="98" y="22" class="tag" fill="#bae6fd" text-anchor="middle">× 3 ENCODER BLOCKS</text>
  <text x="98" y="43" class="body" text-anchor="middle">4-head self-attention</text>
  <text x="98" y="61" class="tiny" text-anchor="middle">Residuals · LayerNorm · LayerScale</text>
</g>
<text x="873" y="608" class="body" text-anchor="middle">FFN 64 → 128 → 64 · GELU</text>
<text x="873" y="631" class="tiny" text-anchor="middle">Pre-norm · dropout 0.4</text>

<!-- connectivity -->
<rect x="1040" y="294" width="512" height="438" rx="18" fill="#2a2115" stroke="#92400e" stroke-width="1.5"/>
<rect x="1062" y="313" width="36" height="25" rx="7" fill="#b45309"/><text x="1080" y="330" class="num" text-anchor="middle">02</text>
<text x="1111" y="331" class="eyebrow" fill="#fcd34d">CONNECTIVITY BRANCH</text>
<text x="1066" y="360" class="muted">Channel-pair relationships form an independent second input.</text>
<path d="M1290 305 V375 H1173 V390" class="wireC"/><path d="M1290 305 V375 H1173 V390" class="flowAmber"/>
<rect x="1066" y="390" width="214" height="264" rx="12" class="connCard"/>
<text x="1084" y="418" class="tag" fill="#fcd34d">1 · RELATIONSHIP MATRIX</text>
<text x="1173" y="450" class="head" text-anchor="middle">Pearson r</text>
<g transform="translate(1113 470)">
  <rect width="120" height="120" rx="5" fill="#3b2a17" stroke="#fbbf24"/>
  <g stroke="#f59e0b" stroke-width=".7" opacity=".9">
    <path d="M15 0V120M30 0V120M45 0V120M60 0V120M75 0V120M90 0V120M105 0V120M0 15H120M0 30H120M0 45H120M0 60H120M0 75H120M0 90H120M0 105H120"/>
  </g>
  <path d="M0 0L120 120" stroke="#fde68a" stroke-width="2.2"/>
  <g fill="#fbbf24" opacity=".75"><rect x="2" y="2" width="11" height="11"/><rect x="17" y="17" width="11" height="11"/><rect x="32" y="32" width="11" height="11"/><rect x="47" y="47" width="11" height="11"/><rect x="62" y="62" width="11" height="11"/><rect x="77" y="77" width="11" height="11"/><rect x="92" y="92" width="11" height="11"/></g>
</g>
<text x="1173" y="615" class="body" text-anchor="middle">19 × 19 symmetric matrix</text>
<text x="1173" y="638" class="tiny" text-anchor="middle">Computed across EEG channels</text>
<path d="M1280 522 H1297" class="wireC"/><path d="M1280 522 H1297" class="flowAmber"/>
<rect x="1301" y="390" width="224" height="264" rx="12" class="connCard"/>
<text x="1319" y="418" class="tag" fill="#fcd34d">2 · ENCODE PAIRS</text>
<text x="1413" y="450" class="head" text-anchor="middle">171 unique pairs</text>
<g transform="translate(1340 471)">
  <rect width="146" height="40" rx="7" fill="#6b451b" stroke="#fbbf24"/>
  <text x="73" y="25" class="body" text-anchor="middle">Upper triangle</text>
  <path d="M73 42V57" class="wireC"/>
  <rect y="60" width="146" height="46" rx="7" fill="#854d0e" stroke="#fbbf24"/>
  <text x="73" y="79" class="body" text-anchor="middle">Dense(32) + ReLU</text>
  <text x="73" y="96" class="tiny" text-anchor="middle">BatchNorm</text>
  <path d="M73 106V121" class="wireC"/>
  <rect y="124" width="146" height="38" rx="7" fill="#713f12" stroke="#fbbf24"/>
  <text x="73" y="148" class="body" text-anchor="middle">Dropout 0.3</text>
</g>
<text x="1413" y="615" class="body" text-anchor="middle">Compact channel-pair code</text>
<text x="1413" y="638" class="tag" fill="#fde68a" text-anchor="middle">32-D VECTOR</text>

<!-- branch outputs / pooling -->
<path d="M873 654 V682 H760 V708" class="wireS"/>
<path d="M873 654 V682 H760 V708" class="flow"/>
<rect x="620" y="708" width="280" height="58" rx="11" fill="#0e4a66" stroke="#67e8f9" stroke-width="1.4"/>
<text x="760" y="732" class="head" text-anchor="middle">Global average pooling</text>
<text x="760" y="752" class="muted" text-anchor="middle">over 40 tokens + LayerNorm</text>
<path d="M1413 654 V682 H1150 V708" class="wireC"/>
<path d="M1413 654 V682 H1150 V708" class="flowAmber"/>
<rect x="1010" y="708" width="280" height="58" rx="11" fill="#6b451b" stroke="#fbbf24" stroke-width="1.4"/>
<text x="1150" y="733" class="head" text-anchor="middle">Connectivity representation</text>
<text x="1150" y="753" class="muted" text-anchor="middle">Dense encoder output</text>

<!-- fusion -->
<path d="M760 766 V794 H800 V816" class="wireS"/>
<path d="M1150 766 V794 H800 V816" class="wireC"/>
<path d="M760 766 V794 H800 V816" class="flow"/>
<path d="M1150 766 V794 H800 V816" class="flowAmber"/>
<rect x="510" y="816" width="580" height="98" rx="15" class="fuseCard"/>
<text x="800" y="844" class="eyebrow" fill="#ddd6fe" text-anchor="middle">03 · LATE FEATURE FUSION</text>
<g transform="translate(565 860)">
  <rect width="180" height="34" rx="8" fill="#0e7490" stroke="#67e8f9"/><text x="90" y="22" class="body" text-anchor="middle">64 spectral features</text>
  <text x="203" y="23" class="head" text-anchor="middle">+</text>
  <rect x="226" width="180" height="34" rx="8" fill="#854d0e" stroke="#fbbf24"/><text x="316" y="22" class="body" text-anchor="middle">32 connectivity features</text>
  <text x="428" y="23" class="head" text-anchor="middle">=</text>
  <rect x="451" width="72" height="34" rx="8" fill="#5b3b87" stroke="#c4b5fd"/><text x="487" y="22" class="head" text-anchor="middle">96</text>
</g>
<path d="M800 914 V941" class="wire"/>
<path d="M800 914 V941" class="flowPurple"/>
<rect x="520" y="945" width="560" height="82" rx="14" fill="url(#fusion)" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="800" y="972" class="eyebrow" fill="#ddd6fe" text-anchor="middle">04 · CLASSIFICATION HEAD</text>
<text x="800" y="1002" class="head" text-anchor="middle">Dense(32, GELU)  →  Dropout(0.5)  →  Dense(2, Softmax)</text>
<path d="M800 1027 V1050" class="wire"/>
<path d="M800 1027 V1050" class="flowPurple"/>
<rect x="555" y="1054" width="490" height="88" rx="14" fill="url(#out)" stroke="#4ade80" stroke-width="1.5"/>
<text x="800" y="1081" class="eyebrow" fill="#bbf7d0" text-anchor="middle">MODEL OUTPUT · TWO CLASS PROBABILITIES</text>
<rect x="590" y="1095" width="190" height="31" rx="7" fill="#14532d" stroke="#86efac"/><text x="685" y="1116" class="body" text-anchor="middle">Control · p₀</text>
<rect x="820" y="1095" width="190" height="31" rx="7" fill="#14532d" stroke="#86efac"/><text x="915" y="1116" class="body" text-anchor="middle">ADHD · p₁</text>

<!-- explanatory footnotes -->
<rect x="48" y="785" width="400" height="357" rx="15" class="panel"/>
<text x="72" y="818" class="eyebrow" fill="#cbd5e1">HOW TO READ THIS MODEL</text>
<circle cx="80" cy="858" r="5" fill="#38bdf8"/><text x="96" y="863" class="body">Blue = spectral-temporal feature path</text>
<circle cx="80" cy="891" r="5" fill="#f59e0b"/><text x="96" y="896" class="body">Amber = channel-connectivity path</text>
<circle cx="80" cy="924" r="5" fill="#c4b5fd"/><text x="96" y="929" class="body">Violet = fusion and classification</text>
<path d="M72 950H424" class="divider"/>
<text x="72" y="978" class="tag" fill="#bfdbfe">IMPORTANT DISTINCTIONS</text>
<text x="72" y="1006" class="body">• Both branches use the same cleaned window.</text>
<text x="72" y="1031" class="body">• Connectivity is a separate model input.</text>
<text x="72" y="1056" class="body">• CNN tokens are not raw EEG channels.</text>
<text x="72" y="1081" class="body">• Softmax values are model scores, not diagnosis.</text>
<text x="72" y="1117" class="tiny">Tensor shapes include batch dimension B.</text>

<!-- training / evaluation note -->
<rect x="1120" y="785" width="432" height="357" rx="15" class="panel"/>
<text x="1144" y="818" class="eyebrow" fill="#cbd5e1">TRAINING + EVALUATION CONTEXT</text>
<text x="1144" y="855" class="tag" fill="#a5b4fc">TRAINING RECIPE · NOT EXTRA LAYERS</text>
<text x="1144" y="882" class="body">AdamW · learning rate 1e−4 · weight decay 1e−2</text>
<text x="1144" y="906" class="body">Categorical focal loss · γ = 2 · batch size 64</text>
<text x="1144" y="930" class="body">20 epochs · gradient clipping · seed 42</text>
<path d="M1144 951H1528" class="divider"/>
<text x="1144" y="979" class="tag" fill="#a5f3fc">PARTICIPANT-AWARE SPLIT</text>
<text x="1144" y="1006" class="body">StratifiedGroupKFold · 7 folds</text>
<text x="1144" y="1030" class="body">5 train · 1 validation · 1 held-out test</text>
<text x="1144" y="1054" class="body">Participant identities kept separate</text>
<text x="1144" y="1088" class="tiny">Saved baseline test cohort: 18 participants.</text>
<text x="1144" y="1112" class="tiny">Small cohort; external validation is still needed.</text>

<text x="800" y="1173" class="muted" text-anchor="middle">Research implementation schematic · main EEG-only CNN–ViT experiment · not a medical device or diagnostic tool</text>
</svg>