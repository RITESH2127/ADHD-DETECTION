<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Animated ADHD EEG hybrid CNN Vision Transformer architecture</title>
<desc id="desc">An animated architecture diagram showing a preprocessed EEG window splitting into a spectral STFT CNN Vision Transformer branch and a Pearson functional connectivity branch, then merging into a classifier that outputs Control or ADHD probabilities.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2d"/><stop offset="1" stop-color="#17243a"/></linearGradient>
  <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  <linearGradient id="conn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#713f12"/><stop offset="1" stop-color="#b45309"/></linearGradient>
  <linearGradient id="fuse" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c1d95"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a9c2df"/></marker>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#f1f5f9}.sub{font:13px Arial,sans-serif;fill:#a9bbd1}
    .label{font:700 13px Arial,sans-serif;fill:#f8fafc;letter-spacing:.8px}
    .node{fill:#203149;stroke:#49617e;stroke-width:1.4}.nodeText{font:600 14px Arial,sans-serif;fill:#f8fafc;text-anchor:middle}.small{font:12px Arial,sans-serif;fill:#c5d2e1;text-anchor:middle}
    .specNode{fill:#12394a;stroke:#38bdf8;stroke-width:1.4}.connNode{fill:#493016;stroke:#f59e0b;stroke-width:1.4}.fuseNode{fill:#38215f;stroke:#c4b5fd;stroke-width:1.4}
    .wire{fill:none;stroke:#8aa5c3;stroke-width:2.4;marker-end:url(#arrow)}.flow{fill:none;stroke:#e0f2fe;stroke-width:3;stroke-dasharray:7 13;stroke-linecap:round;opacity:.95;animation:dash 1.6s linear infinite}
    .particle{fill:#fff;filter:url(#shadow)}.section{font:700 12px Arial,sans-serif;letter-spacing:1.5px}
    @keyframes dash{to{stroke-dashoffset:-40}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:5 8}.pulse{animation:none}}
  </style>
</defs>
<rect width="1200" height="790" rx="24" fill="url(#bg)"/>
<text x="48" y="55" class="title">Inside the hybrid EEG model</text>
<text x="48" y="80" class="sub">One 2-second EEG window · two complementary feature paths · late fusion · two-class output</text>
<rect x="40" y="110" width="1120" height="620" rx="18" fill="#0d1728" stroke="#2b405a"/>
<!-- Input -->
<rect x="465" y="132" width="270" height="76" rx="13" class="node"/>
<text x="600" y="161" class="nodeText">PREPROCESSED EEG</text><text x="600" y="184" class="small">[B, 256, 19] · 128 Hz</text>
<path d="M600 208 V236 H300 V270 M600 236 H900 V270" class="wire"/>
<path d="M600 208 V236 H300 V270 M600 236 H900 V270" class="flow"/>
<!-- spectral lane -->
<rect x="65" y="240" width="470" height="390" rx="15" fill="#10283a" stroke="#155e75"/>
<text x="88" y="266" class="section" fill="#67e8f9">01 / SPECTRAL CNN + VISION TRANSFORMER</text>
<rect x="95" y="290" width="190" height="66" rx="10" class="specNode"/><text x="190" y="317" class="nodeText">STFT + log magnitude</text><text x="190" y="339" class="small">[B, 41, 17, 19]</text>
<rect x="315" y="290" width="190" height="66" rx="10" class="specNode"/><text x="410" y="317" class="nodeText">CNN feature stages</text><text x="410" y="339" class="small">16 → 32 → 64 filters</text>
<path d="M285 323 H315" class="wire"/><path d="M285 323 H315" class="flow"/>
<rect x="315" y="392" width="190" height="66" rx="10" class="specNode"/><text x="410" y="419" class="nodeText">40 learned tokens</text><text x="410" y="441" class="small">[B, 40, 64]</text>
<rect x="95" y="392" width="190" height="66" rx="10" class="specNode"/><text x="190" y="419" class="nodeText">5 × 8 feature grid</text><text x="190" y="441" class="small">[B, 5, 8, 64]</text>
<path d="M410 356 V392 M315 425 H285" class="wire"/><path d="M410 356 V392 M315 425 H285" class="flow"/>
<rect x="95" y="494" width="410" height="72" rx="10" class="specNode"/><text x="300" y="523" class="nodeText">3 Transformer blocks · 4-head attention</text><text x="300" y="547" class="small">Position embedding · residuals · GELU · LayerNorm</text>
<path d="M190 458 V476 H300 V494" class="wire"/><path d="M190 458 V476 H300 V494" class="flow"/>
<rect x="185" y="584" width="230" height="35" rx="9" fill="#0e7490" stroke="#67e8f9"/><text x="300" y="607" class="nodeText">64-D spectral vector</text>
<path d="M300 566 V584" class="wire"/><path d="M300 566 V584" class="flow"/>
<!-- connectivity lane -->
<rect x="665" y="240" width="470" height="390" rx="15" fill="#2b2115" stroke="#92400e"/>
<text x="688" y="266" class="section" fill="#fbbf24">02 / FUNCTIONAL CONNECTIVITY</text>
<rect x="695" y="290" width="190" height="66" rx="10" class="connNode"/><text x="790" y="317" class="nodeText">Pearson correlation</text><text x="790" y="339" class="small">19 × 19 matrix</text>
<rect x="915" y="290" width="190" height="66" rx="10" class="connNode"/><text x="1010" y="317" class="nodeText">Upper triangle</text><text x="1010" y="339" class="small">171 unique pairs</text>
<path d="M885 323 H915" class="wire"/><path d="M885 323 H915" class="flow"/>
<rect x="795" y="392" width="210" height="66" rx="10" class="connNode"/><text x="900" y="419" class="nodeText">Dense(32) + ReLU</text><text x="900" y="441" class="small">BatchNorm · Dropout 0.3</text>
<path d="M1010 356 V374 H900 V392" class="wire"/><path d="M1010 356 V374 H900 V392" class="flow"/>
<rect x="795" y="494" width="210" height="72" rx="10" class="connNode"/><text x="900" y="523" class="nodeText">32-D connectivity vector</text><text x="900" y="547" class="small">Learned channel-pair features</text>
<path d="M900 458 V494" class="wire"/><path d="M900 458 V494" class="flow"/>
<!-- fusion -->
<path d="M300 619 V654 H600 V674 M900 566 V654 H600" class="wire"/>
<path d="M300 619 V654 H600 V674 M900 566 V654 H600" class="flow"/>
<rect x="455" y="674" width="290" height="42" rx="11" class="fuseNode"/>
<text x="600" y="700" class="nodeText">LATE FUSION · 64 + 32 = 96</text>
<rect x="805" y="674" width="300" height="42" rx="11" class="fuseNode"/>
<text x="955" y="700" class="nodeText">Dense(32) → Dropout → Softmax(2)</text>
<path d="M745 695 H805" class="wire"/><path d="M745 695 H805" class="flow"/>
<text x="955" y="750" class="small">CONTROL probability  ·  ADHD probability</text>
<circle r="5" class="particle"><animateMotion dur="3.6s" repeatCount="indefinite" path="M600 208 V236 H300 V270"/></circle>
<circle r="5" class="particle"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M600 208 V236 H900 V270"/></circle>
<text x="48" y="765" class="sub">Schematic of the implemented EEG-only main experiment · not a diagnostic system</text>
</svg>