<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ADHD EEG research — from signal to representation</title>
  <desc id="desc">A dark scientific banner showing an EEG waveform flowing into spectral features, a hybrid CNN and Vision Transformer, and a functional connectivity graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".55" stop-color="#102746"/>
      <stop offset="1" stop-color="#24194A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45D6C5"/>
      <stop offset=".55" stop-color="#69A7FF"/>
      <stop offset="1" stop-color="#B58CFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17385B" stop-opacity=".95"/>
      <stop offset="1" stop-color="#172342" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9CC4FF" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#grid)"/>
  <circle cx="1350" cy="60" r="260" fill="#6E63FF" opacity=".08"/>
  <circle cx="950" cy="520" r="260" fill="#28D5C2" opacity=".06"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="92" y="104" fill="#9CC8FF" font-size="18" font-weight="700" letter-spacing="5">EEG • DEEP LEARNING • RESEARCH</text>
    <text x="88" y="210" fill="#F4F8FF" font-size="72" font-weight="800" letter-spacing="-2">READING THE</text>
    <text x="88" y="292" fill="url(#accent)" font-size="82" font-weight="800" letter-spacing="-3">NEURAL SIGNAL</text>
    <text x="94" y="350" fill="#D5E2F5" font-size="25">A hybrid CNN–Vision Transformer research pipeline</text>
    <text x="94" y="390" fill="#AFC3DE" font-size="20">Spectral patterns  ×  Functional connectivity  ×  Subject-aware evaluation</text>
    <g transform="translate(95 438)">
      <rect width="190" height="42" rx="21" fill="#163B50" stroke="#45D6C5" stroke-opacity=".7"/>
      <text x="95" y="27" fill="#9BF4E8" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">19-CHANNEL EEG</text>
      <rect x="204" width="170" height="42" rx="21" fill="#1B355D" stroke="#69A7FF" stroke-opacity=".7"/>
      <text x="289" y="27" fill="#C6DEFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">CNN + ViT</text>
      <rect x="388" width="218" height="42" rx="21" fill="#302B59" stroke="#B58CFF" stroke-opacity=".7"/>
      <text x="497" y="27" fill="#DFD0FF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">CONNECTIVITY BRANCH</text>
    </g>
  </g>
  <g transform="translate(770 105)">
    <rect x="0" y="0" width="730" height="330" rx="24" fill="url(#panel)" stroke="#83B9FF" stroke-opacity=".25"/>
    <text x="34" y="42" fill="#AFC9E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">FROM RAW EEG TO LEARNED REPRESENTATIONS</text>
    <g transform="translate(35 80)">
      <rect width="150" height="170" rx="16" fill="#0D223A" stroke="#45D6C5" stroke-opacity=".65"/>
      <text x="75" y="28" fill="#B8F7EF" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">EEG WINDOW</text>
      <path d="M12 95 L24 95 L31 68 L39 125 L49 85 L58 95 L70 95 L79 54 L88 132 L99 82 L110 95 L124 95 L133 72 L141 95" fill="none" stroke="#45D6C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <text x="75" y="146" fill="#8FAFCB" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">256 × 19</text>
    </g>
    <path d="M194 165H224" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M216 157L226 165L216 173" fill="none" stroke="#8CB9FF" stroke-width="3"/>
    <g transform="translate(235 80)">
      <rect width="145" height="170" rx="16" fill="#102A49" stroke="#69A7FF" stroke-opacity=".7"/>
      <text x="72" y="28" fill="#C8DFFF" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">STFT + CNN</text>
      <g transform="translate(17 49)">
        <rect width="111" height="75" rx="7" fill="#163D60"/>
        <path d="M0 58L15 49L28 54L42 26L54 42L69 10L82 31L96 20L111 7V75H0Z" fill="url(#accent)" opacity=".75"/>
        <path d="M0 62H111M0 40H111M0 18H111" stroke="#C6E3FF" stroke-opacity=".25"/>
      </g>
      <text x="72" y="146" fill="#8FAFCB" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Time–frequency</text>
    </g>
    <path d="M389 165H419" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M411 157L421 165L411 173" fill="none" stroke="#8CB9FF" stroke-width="3"/>
    <g transform="translate(430 80)">
      <rect width="145" height="170" rx="16" fill="#172B50" stroke="#9E9BFF" stroke-opacity=".7"/>
      <text x="72" y="28" fill="#D8D6FF" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">VISION TRANSFORMER</text>
      <g fill="#7E9CFF" stroke="#D5D7FF" stroke-opacity=".8">
        <rect x="19" y="53" width="26" height="26" rx="5"/><rect x="59" y="53" width="26" height="26" rx="5"/><rect x="99" y="53" width="26" height="26" rx="5"/>
        <rect x="19" y="91" width="26" height="26" rx="5"/><rect x="59" y="91" width="26" height="26" rx="5"/><rect x="99" y="91" width="26" height="26" rx="5"/>
      </g>
      <path d="M32 66L72 104L112 66M32 104L72 66L112 104" fill="none" stroke="#E3DFFF" stroke-opacity=".8" stroke-width="1.5"/>
      <text x="72" y="146" fill="#A9B1D7" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Token attention</text>
    </g>
    <path d="M584 165H614" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M606 157L616 165L606 173" fill="none" stroke="#8CB9FF" stroke-width="3"/>
    <g transform="translate(625 80)">
      <rect width="75" height="170" rx="16" fill="#302A58" stroke="#B58CFF" stroke-opacity=".8"/>
      <text x="37" y="28" fill="#E5D8FF" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700">FUSION</text>
      <g stroke="#C6A9FF" stroke-width="2" fill="none">
        <path d="M16 62L37 83L59 62M16 62L16 105L37 126L59 105L59 62M16 105L59 105"/>
      </g>
      <circle cx="16" cy="62" r="5" fill="#45D6C5"/><circle cx="59" cy="62" r="5" fill="#69A7FF"/><circle cx="37" cy="83" r="5" fill="#B58CFF"/><circle cx="16" cy="105" r="5" fill="#45D6C5"/><circle cx="59" cy="105" r="5" fill="#69A7FF"/><circle cx="37" cy="126" r="5" fill="#B58CFF"/>
      <text x="37" y="151" fill="#C7B8E8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">2 paths</text>
    </g>
    <g transform="translate(235 275)">
      <text x="0" y="0" fill="#8FAFCB" font-family="Arial,sans-serif" font-size="13">PARALLEL FEATURE PATH</text>
      <text x="0" y="27" fill="#B8F7EF" font-family="Arial,sans-serif" font-size="15" font-weight="700">Pearson correlation • 171 unique channel pairs</text>
    </g>
  </g>
  <text x="1500" y="490" fill="#6F8CAB" font-family="Arial,sans-serif" font-size="13" text-anchor="end">RESEARCH PROTOTYPE • NOT A DIAGNOSTIC TOOL</text>
</svg>